name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Long-lived remediation branches are covered by neither trigger above.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          # Throwaway credentials for a per-run container on the runner's
          # loopback. Deliberately literal -- this is not a deployment, so the
          # ${VAR:?} treatment docker-compose.yml uses does not apply here.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vector_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vector_ci
      SECRET_KEY: ci_test_secret
      # DATA-H1-2. tests/conftest.py builds its own in-memory SQLite engine and
      # overrides the get_db dependency with it, so every other test runs on
      # SQLite even here, whatever DATABASE_URL above names -- this second
      # variable is the only way a test can reach the Postgres service. It is
      # what un-skips tests/test_utc_migration_postgres.py, which is the only
      # check anywhere that the TIMESTAMPTZ migration preserves the instants it
      # moves.
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/vector_ci

    steps:
    - uses: actions/checkout@v4

    # 3.10 matches Dockerfile.backend and backend/pyproject.toml's
    # target-version, not the newer interpreter used for local development.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest httpx

    # WAIVER (DATA-L4): backend/ carries 42 pre-existing ruff findings. They
    # still surface as inline annotations; they just do not fail the build yet.
    # Delete this line when DATA-L4 clears them.
    - name: Lint with ruff
      continue-on-error: true
      run: ruff check backend

    # Hard gate. Proves the initial Alembic migration adopted in DATA-C1 still
    # applies to a clean database -- nothing else in the repo verifies that.
    - name: Apply migrations
      run: alembic upgrade head

    # WAIVER (INF-C3): no tests exist yet, and bare pytest exits 5 on an empty
    # collection. Forgive *only* exit 5 -- a genuine test failure must fail the
    # build from the day the first test lands. Delete this guard with INF-C3.
    - name: Run tests
      run: |
        set +e
        python -m pytest
        code=$?
        set -e
        if [ "$code" -eq 5 ]; then
          echo "::notice::No tests collected yet - see INF-C3"
          exit 0
        fi
        exit $code

    # Hard gate (API-H1). The specification is no longer tracked, so this is
    # where it comes from: generated from the code under test, never stale.
    # A gate because every green run must publish one. Written to a path
    # frontend/.gitignore ignores, so running this line locally cannot leave a
    # file for `git add -A` to track.
    - name: Export OpenAPI specification
      run: python -m backend.export_openapi frontend/openapi.json

    - name: Upload OpenAPI specification
      uses: actions/upload-artifact@v4
      with:
        name: openapi
        path: frontend/openapi.json
        if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Hard gate since FE-H6-4. The script runs with `--max-warnings 0`, so a
    # warning fails this step as an error does. It also fails on a component
    # or hook the React Compiler gives up on, which the compiler-backed rules
    # would otherwise skip without a word (INF-L4). A limit it does not
    # lift: set-state-in-effect checks only the calls written directly in an
    # effect, not what a function called from one does.
    # frontend/src/lintGate.test.ts fails if this step or its job is given
    # `continue-on-error` or an `if:`, and if a .ts or .tsx file carries a
    # disable comment for a react-hooks rule.
    - name: Lint with ESLint
      run: npm run lint

    # Hard gate (FE-H7). `npm run typecheck` is `tsc -b`, which checks both
    # projects tsconfig.json references and writes no JavaScript. Its own step,
    # so a type error fails here by name and not inside the build.
    - name: Typecheck
      run: npm run typecheck

    # Hard gate. `npm run build` runs the typecheck script again before
    # `vite build`, so that script typechecks wherever it is run.
    # frontend/src/typecheckConfig.test.ts pins both scripts, and reads both
    # steps and their job for `continue-on-error` and `if:`.
    - name: Build
      run: npm run build

    # Hard gate from the day it lands, deliberately unlike the ruff waiver in
    # the backend job. The frontend had no test framework at all until SEC-H9;
    # there is no backlog to forgive, so a failure here is always a real
    # regression.
    - name: Run tests
      run: npm run test
