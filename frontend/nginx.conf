# INF-H2. What the frontend image serves. The Dockerfile copies this file to
# /etc/nginx/conf.d/default.conf, in place of the one the nginx image ships.
# The development stack does not use it: docker-compose.yml runs Vite's
# development server.

server {
    # 3000 is the port docker-compose.yml publishes and the origin
    # backend/main.py's CORS list allows (http://localhost:3000).
    listen 3000;
    listen [::]:3000;

    root /usr/share/nginx/html;
    index index.html;

    # text/html is always among the compressed types when gzip is on; these
    # are the others worth compressing here.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The build puts its JavaScript and CSS here under names that contain a
    # hash of their content, so a file never changes under its name and a
    # browser may keep it. A name that does not exist is a 404: answering with
    # the page below would hand HTML to a browser that asked for a script.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else. The application routes in the browser, so /dashboard
    # and the like are not files; they get index.html and the router takes it
    # from there. index.html names the current asset files, so a browser must
    # ask again before reusing its copy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
