services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-military_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-military_db}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
    volumes:
      - ./:/app
    # Ensure hot reload works well by overriding default restart policy if needed
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overwriting container node_modules with host's if host does not have them or OS mismatch

volumes:
  postgres_data:
